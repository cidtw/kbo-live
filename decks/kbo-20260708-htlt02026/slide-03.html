<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720pt;
    height: 720pt;
    font-family: 'Pretendard', sans-serif;
    background: #F5F500;
    color: #000000;
    position: relative;
    overflow: hidden;
    padding: 56pt;
    display: flex;
    flex-direction: column;
  }
  .mono { font-family: 'Space Mono', monospace; }
  .tag {
    display: inline-block;
    background: #FF2D55;
    color: #FFFFFF;
    border: 3pt solid #000000;
    box-shadow: 6pt 6pt 0 0 #000000;
    padding: 6pt 14pt;
    font-size: 13pt;
    font-weight: 700;
  }
  .inning-num {
    position: absolute;
    top: 130pt;
    right: -20pt;
    font-size: 340pt;
    font-weight: 700;
    color: #000000;
    opacity: 0.08;
    line-height: 1;
  }
  .headline {
    margin-top: 220pt;
    font-size: 46pt;
    font-weight: 900;
    line-height: 1.2;
  }
  .detail-box {
    margin-top: 28pt;
    background: #FFFFFF;
    border: 4pt solid #000000;
    box-shadow: 8pt 8pt 0 0 #000000;
    padding: 20pt 24pt;
    font-size: 16pt;
    font-weight: 700;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <span class="tag mono">GAME WINNING RBI</span>
  <p class="inning-num mono">1회</p>
  <h1 class="headline">한동희<br>희생플라이</h1>
  <p class="detail-box">1회 1사 1, 3루 · 중견수 희생플라이로<br>경기의 결승점을 만들었다.</p>
</body>
</html>
