<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720pt;
    height: 720pt;
    font-family: 'Pretendard', sans-serif;
    background: #FFFFFF;
    color: #000000;
    position: relative;
    overflow: hidden;
    padding: 56pt;
    display: flex;
    flex-direction: column;
  }
  .mono { font-family: 'Space Mono', monospace; }
  .tag {
    display: inline-block;
    background: #F5F500;
    border: 3pt solid #000000;
    box-shadow: 6pt 6pt 0 0 #000000;
    padding: 6pt 14pt;
    font-size: 13pt;
    font-weight: 700;
  }
  .score-row {
    margin-top: 40pt;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24pt;
  }
  .team-block { text-align: center; }
  .team-name { font-size: 18pt; font-weight: 700; margin-bottom: 6pt; }
  .score-num { font-size: 84pt; font-weight: 700; line-height: 1; }
  .score-num.win { color: #FF2D55; }
  .colon { font-size: 40pt; font-weight: 700; }

  .grid-box {
    margin-top: 44pt;
    border: 4pt solid #000000;
    box-shadow: 8pt 8pt 0 0 #000000;
    background: #FFFFFF;
  }
  .grid-row {
    display: grid;
    grid-template-columns: 72pt repeat(3, 1fr) 32pt 32pt 32pt 32pt;
  }
  .grid-row + .grid-row { border-top: 3pt solid #000000; }
  .cell {
    padding: 10pt 6pt;
    text-align: center;
    font-size: 13pt;
    font-weight: 700;
    border-left: 3pt solid #000000;
  }
  .cell:first-child { border-left: none; text-align: left; padding-left: 12pt; }
  .header-row .cell { background: #000000; color: #FFFFFF; font-size: 11pt; }
  .cell.dash { color: #bbbbbb; }

  .footer {
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    font-size: 13pt;
    font-weight: 700;
  }
</style>
</head>
<body>
  <span class="tag mono">FINAL SCORE</span>

  <div class="score-row">
    <div class="team-block">
      <p class="team-name">KIA</p>
      <p class="score-num mono">0</p>
    </div>
    <p class="colon mono">:</p>
    <div class="team-block">
      <p class="team-name">롯데</p>
      <p class="score-num mono win">1</p>
    </div>
  </div>

  <div class="grid-box mono">
    <div class="grid-row header-row">
      <div class="cell">TEAM</div>
      <div class="cell">1</div>
      <div class="cell">2</div>
      <div class="cell">3</div>
      <div class="cell">R</div>
      <div class="cell">H</div>
      <div class="cell">E</div>
      <div class="cell">B</div>
    </div>
    <div class="grid-row">
      <div class="cell">KIA</div>
      <div class="cell">0</div>
      <div class="cell">0</div>
      <div class="cell">0</div>
      <div class="cell">0</div>
      <div class="cell">1</div>
      <div class="cell">0</div>
      <div class="cell">1</div>
    </div>
    <div class="grid-row">
      <div class="cell">롯데</div>
      <div class="cell">1</div>
      <div class="cell">0</div>
      <div class="cell">0</div>
      <div class="cell">1</div>
      <div class="cell">3</div>
      <div class="cell">0</div>
      <div class="cell">1</div>
    </div>
  </div>

  <div class="footer mono">
    <p>18:30 PM START</p>
    <p>27°C</p>
  </div>
</body>
</html>
