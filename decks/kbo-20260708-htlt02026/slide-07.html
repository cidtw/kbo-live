<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720pt;
    height: 720pt;
    font-family: 'Pretendard', sans-serif;
    background: #FFFFFF;
    color: #000000;
    position: relative;
    overflow: hidden;
    padding: 56pt;
    display: flex;
    flex-direction: column;
  }
  .mono { font-family: 'Space Mono', monospace; }
  .tag {
    display: inline-block;
    background: #F5F500;
    border: 3pt solid #000000;
    box-shadow: 6pt 6pt 0 0 #000000;
    padding: 6pt 14pt;
    font-size: 13pt;
    font-weight: 700;
  }
  .title { margin-top: 20pt; font-size: 30pt; font-weight: 900; }
  .grid {
    margin-top: 28pt;
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(3, 1fr);
    gap: 16pt;
  }
  .box {
    border: 3pt solid #000000;
    box-shadow: 6pt 6pt 0 0 #000000;
    padding: 14pt 16pt;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .box.wide { grid-column: span 2; }
  .label {
    font-size: 11pt;
    font-weight: 700;
    background: #000000;
    color: #FFFFFF;
    display: inline-block;
    padding: 2pt 8pt;
    align-self: flex-start;
  }
  .value {
    margin-top: 8pt;
    font-size: 14pt;
    font-weight: 700;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <span class="tag mono">BOX SCORE NOTES</span>
  <h1 class="title">세부 기록</h1>

  <div class="grid">
    <div class="box">
      <p class="label mono">2B</p>
      <p class="value">김호령, 레이예스, 변우혁</p>
    </div>
    <div class="box">
      <p class="label mono">SB</p>
      <p class="value">황성빈 2개</p>
    </div>
    <div class="box">
      <p class="label mono">E</p>
      <p class="value">박재현, 김호령, 김선빈</p>
    </div>
    <div class="box">
      <p class="label mono">GDP</p>
      <p class="value">나성범</p>
    </div>
    <div class="box">
      <p class="label mono">WP / PB</p>
      <p class="value">폭투 네일 · 포일 주효상</p>
    </div>
    <div class="box wide">
      <p class="label mono">UMPIRE</p>
      <p class="value">이호성 · 최영주 · 권영철 · 박근영</p>
    </div>
  </div>
</body>
</html>
