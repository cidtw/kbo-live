<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720pt;
    height: 720pt;
    font-family: 'Pretendard', sans-serif;
    background: #FFFFFF;
    color: #000000;
    position: relative;
    overflow: hidden;
    padding: 56pt;
    display: flex;
    flex-direction: column;
  }
  .mono { font-family: 'Space Mono', monospace; }
  .tag {
    display: inline-block;
    background: #F5F500;
    border: 3pt solid #000000;
    box-shadow: 6pt 6pt 0 0 #000000;
    padding: 6pt 14pt;
    font-size: 13pt;
    font-weight: 700;
  }
  .title {
    margin-top: 20pt;
    font-size: 30pt;
    font-weight: 900;
  }
  .rows {
    margin-top: 32pt;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20pt;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 20pt;
    border: 4pt solid #000000;
    box-shadow: 8pt 8pt 0 0 #000000;
    padding: 18pt 22pt;
    background: #FFFFFF;
  }
  .row.first { background: #FF2D55; color: #FFFFFF; }
  .rank { font-size: 22pt; font-weight: 700; width: 32pt; }
  .name { flex: 1; font-size: 20pt; font-weight: 900; }
  .hit-frac { font-size: 26pt; font-weight: 700; }
  .avg { font-size: 13pt; font-weight: 700; opacity: 0.85; margin-left: 12pt; }
  .note { margin-top: 4pt; font-size: 12pt; font-weight: 700; opacity: 0.85; }
  .right-block { text-align: right; }
</style>
</head>
<body>
  <span class="tag mono">BATTING LEADERS</span>
  <h1 class="title">이 날의 안타왕</h1>

  <div class="rows mono">
    <div class="row first">
      <p class="rank">01</p>
      <p class="name" style="font-family:'Pretendard',sans-serif;">레이예스</p>
      <div class="right-block">
        <p class="hit-frac">4타수 3안타</p>
        <p class="note">1타점 · 타율 .352</p>
      </div>
    </div>
    <div class="row">
      <p class="rank">02</p>
      <p class="name" style="font-family:'Pretendard',sans-serif;">박찬형</p>
      <div class="right-block">
        <p class="hit-frac">5타수 2안타</p>
        <p class="note">타율 .417</p>
      </div>
    </div>
    <div class="row">
      <p class="rank">03</p>
      <p class="name" style="font-family:'Pretendard',sans-serif;">황성빈</p>
      <div class="right-block">
        <p class="hit-frac">5타수 2안타</p>
        <p class="note">도루 2개 · 타율 .295</p>
      </div>
    </div>
  </div>
</body>
</html>
