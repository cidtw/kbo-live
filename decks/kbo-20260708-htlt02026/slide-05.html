<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720pt;
    height: 720pt;
    font-family: 'Pretendard', sans-serif;
    background: #F5F500;
    color: #000000;
    position: relative;
    overflow: hidden;
    padding: 56pt;
    display: flex;
    flex-direction: column;
  }
  .mono { font-family: 'Space Mono', monospace; }
  .tag {
    display: inline-block;
    background: #000000;
    color: #FFFFFF;
    border: 3pt solid #000000;
    box-shadow: 6pt 6pt 0 0 #FF2D55;
    padding: 6pt 14pt;
    font-size: 13pt;
    font-weight: 700;
  }
  .hr-num {
    margin-top: 40pt;
    font-size: 220pt;
    font-weight: 700;
    line-height: 1;
    color: #FF2D55;
    -webkit-text-stroke: 3pt #000000;
  }
  .headline {
    margin-top: 8pt;
    font-size: 44pt;
    font-weight: 900;
    line-height: 1.2;
  }
  .detail-box {
    margin-top: 28pt;
    background: #FFFFFF;
    border: 4pt solid #000000;
    box-shadow: 8pt 8pt 0 0 #000000;
    padding: 20pt 24pt;
    font-size: 16pt;
    font-weight: 700;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <span class="tag mono">HOME RUN</span>
  <p class="hr-num mono">1호</p>
  <h1 class="headline">김세민<br>시즌 첫 홈런</h1>
  <p class="detail-box">8회 1점 홈런 · 상대 투수 이태양</p>
</body>
</html>
