<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 720pt;
    height: 720pt;
    font-family: 'Pretendard', sans-serif;
    background: #F5F500;
    color: #000000;
    position: relative;
    overflow: hidden;
    padding: 56pt;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .mono { font-family: 'Space Mono', monospace; }
  .headline {
    margin-top: 120pt;
    font-size: 58pt;
    font-weight: 900;
    line-height: 1.15;
  }
  .chip {
    align-self: flex-start;
    margin-top: 28pt;
    background: #FF2D55;
    color: #FFFFFF;
    border: 3pt solid #000000;
    box-shadow: 6pt 6pt 0 0 #000000;
    padding: 8pt 16pt;
    font-size: 15pt;
    font-weight: 700;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-size: 13pt;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div>
    <h1 class="headline">사직 투수전,<br>승자는 롯데</h1>
    <span class="chip">다음 경기도 계속됩니다</span>
  </div>
  <div class="footer mono">
    <p>KBO 2026</p>
    <p>2026.7.8 SAJIK</p>
  </div>
</body>
</html>
